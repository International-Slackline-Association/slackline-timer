name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard, slow or error-prone today? Describe the
        situation rather than the solution — competition context helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who it is for
      options:
        - Operator running the timer
        - Judge scoring freestyle
        - Broadcast / stream production
        - Competition organiser (admin pages)
        - Developer / maintainer
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
