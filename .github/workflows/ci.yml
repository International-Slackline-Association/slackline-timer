name: CI

# Push trigger is mainline-only, so an open PR's branch runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo; the explicit grant also caps the token on pushes.
permissions:
  contents: read

jobs:
  quality:
    name: Lint & format (repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier (check only)
        run: npx prettier --check "**/*.{js,ts,tsx,json,md,yml,yaml}"

  web:
    name: web — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web's build is `eslint . && vite build`; eslint is a ROOT devDependency,
      # reachable only via the ancestor node_modules/.bin.
      - name: Install root deps (eslint)
        working-directory: .
        run: npm ci
      - run: npm ci
      - name: Type-check
        run: npm run checkTs
      - name: Test (coverage)
        run: npm run test:coverage
      # The build refuses any unset endpoint or CSP origin. Unreachable
      # placeholders: this artifact is a compile check, never a deployable.
      - name: Build
        run: npm run build
        env:
          VITE_APP_WS_URL: wss://ci.invalid/prod
          VITE_APP_API_URL: https://ci.invalid/prod
          # Region-shaped: the build-time CSP derives the cognito-idp origin from it.
          VITE_APP_COGNITO_USER_POOL_ID: eu-central-1_ciplaceholder
          VITE_APP_COGNITO_CLIENT_ID: ciplaceholderclientid000
          VITE_APP_COGNITO_DOMAIN: ci.invalid
          VITE_APP_COGNITO_TIMER_GROUP: ci-placeholder-group
          WEB_CSP_PHOTO_CDN_DOMAIN: photos.ci.invalid
          WEB_CSP_PHOTO_UPLOAD_ORIGIN: https://uploads.ci.invalid
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  server:
    name: server — typecheck, test, synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The *.int.test.ts suites self-skip when :4566 is closed (helpers.ts
    # `isDynamoReachable`); without this container they pass green untested.
    # No `db:init`: the suites create their own tables in AWS_REGION=local
    # (env.setup.ts), and LocalStack partitions by region (db:init uses
    # eu-central-1).
    services:
      localstack:
        # Same pin as docker/docker-compose.yml (rationale there); bump both
        # together — server/test/repo/localstack-pin.test.ts fails on drift.
        image: localstack/localstack:3.8.1@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,s3
          DEBUG: '0'
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run checkTs
      # Before the suites collect: a broken container would otherwise skip them
      # to a silent green.
      - name: Assert LocalStack is reachable
        run: curl -sf --retry 12 --retry-delay 5 --retry-connrefused http://localhost:4566/_localstack/health
      - name: Test (coverage)
        run: npm run test:coverage
      # The deploy-path gate: the real infra/app.ts through the CDK CLI (cdk.json
      # feature flags, all three stacks). Deploy config has no defaults
      # (ADR 0048); placeholders match the infra tests'.
      - name: Synth (cdk)
        run: |
          npm run synth -- \
            -c billingAlertEmail=billing-alerts@example.org \
            -c cognitoUserPoolId=eu-central-1_testpool \
            -c cognitoClientId=test-client-id \
            -c cognitoTimerGroup=timeradmin \
            -c cognitoRegion=eu-central-1
