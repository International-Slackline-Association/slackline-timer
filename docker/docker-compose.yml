# Local development infrastructure for Slackline Timer.
#
# Paths are relative to this file (docker/). Managed from the repo root via
# `npm run db:up` / `npm run db:down`. See doc/dev/local-dev.md.
#
# LocalStack emulates DynamoDB + S3 on :4566. The Lambdas run on the host in the
# in-process harnesses (server/scripts/local*Harness.mjs): WebSocket +
# Lambda-asset emulation needs LocalStack Pro (ADR 0023, phase 2). Tables +
# photo bucket: `npm run db:init`.

services:
  localstack:
    # Community edition (free, tokenless): DynamoDB + S3 are fully supported.
    # Pinned to the :3 line — :latest / the 2026.x builds refuse to boot without
    # a LOCALSTACK_AUTH_TOKEN (exit 55, "License activation failed"), even for
    # community services. Phase 2 (LocalStack Pro) revisits image + token.
    # Same reference as the CI service in .github/workflows/ci.yml; Dependabot
    # bumps neither, so bump both together (server/test/repo/localstack-pin.test.ts).
    image: localstack/localstack:3.8.1@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    container_name: slackline-localstack
    ports:
      - '4566:4566'
    environment:
      # Only the services the offline backend uses (faster start, less noise).
      SERVICES: dynamodb,s3
      AWS_DEFAULT_REGION: eu-central-1
      DEBUG: '0'
    volumes:
      # Community edition does not persist across restarts (PERSISTENCE is a Pro
      # feature); the volume is harmless and `npm run db:init` re-provisions.
      - localstack-data:/var/lib/localstack
    restart: unless-stopped
    networks:
      - slackline-network

networks:
  slackline-network:
    driver: bridge

volumes:
  localstack-data:
